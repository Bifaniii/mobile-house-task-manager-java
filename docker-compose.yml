services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-usuario
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-usuario:
    build: ./ms-usuario
    container_name: ms-usuario-app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - usuario_data:/app/data
    environment:
      DB_PATH: /app/data/ms-usuario.db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

  ms-tarefa:
    build: ./ms-tarefa
    container_name: ms-tarefa-app
    restart: unless-stopped
    depends_on:
      ms-usuario:
        condition: service_started
    ports:
      - "8082:8082"
    volumes:
      - tarefa_data:/app/data
    environment:
      DB_PATH: /app/data/ms-tarefa.db
      MS_USUARIOS_URL: http://ms-usuario:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000

volumes:
  usuario_data:
  tarefa_data:
