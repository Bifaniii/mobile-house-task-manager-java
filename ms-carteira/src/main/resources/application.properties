spring.application.name=ms-carteira
# O Render injeta a porta na variavel PORT
server.port=${PORT:8083}

# SQLite: o arquivo e criado sozinho na primeira execucao (DB_PATH muda o local)
spring.datasource.url=jdbc:sqlite:${DB_PATH:ms-carteira.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite aceita um escritor por vez: uma conexao evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# TEM que ser identico ao do ms-usuario, senao nenhum token valida
jwt.secret=${JWT_SECRET}

# RabbitMQ: em producao, defina SPRING_RABBITMQ_ADDRESSES (ex.: a URL amqps do CloudAMQP).
spring.rabbitmq.connection-timeout=3s
