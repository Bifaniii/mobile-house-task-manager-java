spring.application.name=ms-tarefa
# O Render injeta a porta na variavel PORT
server.port=${PORT:8082}

# URL base do microservico de usuarios
ms-usuarios.url=${MS_USUARIOS_URL:http://localhost:8080}

# SQLite: o arquivo e criado sozinho na primeira execucao (DB_PATH muda o local)
spring.datasource.url=jdbc:sqlite:${DB_PATH:ms-tarefa.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite aceita um escritor por vez: uma conexao evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# TEM que ser identico ao do ms-usuario, senao nenhum token valida
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# timeout p/ o RestClient nao travar se o ms-usuario pendurar
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s
