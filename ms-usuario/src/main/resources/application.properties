spring.application.name=ms-usuario
# O Render injeta a porta na variavel PORT
server.port=${PORT:8080}

# SQLite: o arquivo e criado sozinho na primeira execucao (DB_PATH muda o local)
spring.datasource.url=jdbc:sqlite:${DB_PATH:ms-usuario.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite aceita um escritor por vez: uma conexao evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT - TEM que ser identico ao do ms-tarefa (minimo 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# RabbitMQ (se nao houver broker, o cadastro segue e so registra um aviso no log)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=
spring.rabbitmq.password=

app.rabbitmq.exchange=usuario.exchange
app.rabbitmq.routingkey.usuario-criado=usuario.criado

# Mail (recuperacao de senha)
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
